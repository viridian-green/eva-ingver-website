<div class="page">
  <main>
    <!-- ===== DELIVERY =====
         The delivery regions and fees for the shop. Each piece's page shows this picker
         above the Buy button, and the checkout charges the fee of the region the buyer picks.

         One flat fee per order, depending on where it is delivered:
         data-fee        the fee, number only (e.g. 12 or 12.50), in the shop's currency
         data-countries  two-letter country codes separated by spaces,
                         or * for every country not listed in the other lines
         the words between the tags: the region's name

         At checkout, customers can only enter an address in the region they picked.
         To add a region, copy an <option ...>...</option> line and change it.
  </main>
</div>
