<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eva Ingver</title>
  <meta name="description" content="Handmade work by Studio Name.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header>
    <a href="index.html" class="site-name">Eva Ingver</a>
    <nav>
      <a href="index.html" aria-current="page">Work</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <p>A small studio working with clay, linen and paper. Each piece is made one at a time.</p>
    </section>

    <!-- ===== PICTURES =====
         To add a picture:
         1. Put the photo in the "images" folder.
         2. Copy one <figure> ... </figure> block and paste it below the others.
         3. Change the file name after src= and the words in alt= and <figcaption>.
         To remove a picture, delete its whole <figure> ... </figure> block.
         The pictures sit side by side in one row, in the order they are written here;
         visitors scroll sideways to see them all. -->
    <section class="row">
      <figure>
        <img src="images/work-1.jpg" alt="Speckled stoneware bowls" loading="lazy">
        <figcaption>Stoneware bowls, 2026</figcaption>
      </figure>
      <figure>
        <img src="images/work-2.jpg" alt="Linen cloth folded on a table" loading="lazy">
        <figcaption>Linen, hand-dyed</figcaption>
      </figure>
      <figure>
        <img src="images/work-3.jpg" alt="Handbound notebooks" loading="lazy">
        <figcaption>Handbound notebooks</figcaption>
      </figure>
      <figure>
        <img src="images/work-4.jpg" alt="Studio shelves with drying pots" loading="lazy">
        <figcaption>In the studio</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>© 2026 Eva Ingver</p>
  </footer>

</div>
<script src="js/birds.js"></script>
</body>
</html>
